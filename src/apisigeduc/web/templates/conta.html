{% extends "base.html" %}
{% block titulo %}Minha conta{% endblock %}
{% block conteudo %}
<div class="cartao estreito" style="margin-top:0">
  <h1>Minha conta</h1>
  <p class="suave">{{ usuario.nome }} · {{ usuario.email }}{% if usuario.admin %} · administrador{% endif %}</p>
  <div class="botoes" style="margin:4px 0 20px">
    <a class="botao secundario" href="/credencial">Senha do SIGEduc</a>
    {% if usuario.admin %}<a class="botao secundario" href="/admin/usuarios">Usuários</a>{% endif %}
    <form method="post" action="/sair" style="margin:0"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="botao secundario">Sair</button></form>
  </div>
  <h2>Trocar senha de acesso</h2>
  <form method="post" action="/conta/senha">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label for="atual">Senha atual</label>
    <input type="password" id="atual" name="atual" required autocomplete="current-password">
    <label for="nova">Nova senha (mínimo 8 caracteres)</label>
    <input type="password" id="nova" name="nova" required minlength="8" autocomplete="new-password">
    <label for="confirmacao">Repita a nova senha</label>
    <input type="password" id="confirmacao" name="confirmacao" required minlength="8" autocomplete="new-password">
    <div class="botoes"><button class="botao">Trocar senha</button></div>
  </form>
</div>
{% endblock %}
