[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apisigeduc"
version = "0.1.0"
description = "Automação para alimentar dados no SIGEduc a partir de planilhas"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.44",
    "python-dotenv>=1.0",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "cryptography>=42",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
apisigeduc = "apisigeduc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
apisigeduc = ["web/templates/*.html", "web/static/*", "web/static/icones/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
